<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Sign in · Congo Signal</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1310;color:#edf4ee;font:16px/1.55 system-ui,sans-serif;min-height:100svh;display:grid;place-items:center;padding:24px}main{width:min(440px,100%);background:#14201a;border:1px solid #344b3c;border-radius:16px;padding:28px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:12px;letter-spacing:2px;color:#bbdf9b}h1{font-size:28px;line-height:1.2;margin:28px 0 12px}p{color:#afc0b3}label{display:block;margin:18px 0 6px}input,button{font:inherit;min-height:48px;border-radius:8px}input{width:100%;background:#0b1310;color:#edf4ee;border:1px solid #4b6352;padding:12px}button{cursor:pointer;background:#c8dd91;color:#142010;border:0;padding:10px 16px}button:disabled{opacity:.6;cursor:wait}.primary{width:100%;font-weight:650;margin-top:24px}.link{background:none;color:#c8dd91;padding:8px 0;text-align:left}.lang{background:#26372b;color:#edf4ee;font-size:14px}#status{white-space:pre-wrap;overflow-wrap:anywhere}#status.error{color:#ffb7a9}.foot{font-size:13px;border-top:1px solid #344b3c;padding-top:18px;margin-top:20px}a{color:#c8dd91}[hidden]{display:none!important}:focus-visible{outline:3px solid #c8dd91;outline-offset:3px}
</style></head><body><main><header><strong class="brand">CONGO SIGNAL</strong><button class="lang" id="lang" type="button">FR</button></header><h1 id="title">Welcome back</h1><p id="intro">Sign in to your invited workspace.</p><form id="login"><label for="email" id="email-label">Email</label><input id="email" name="email" type="email" autocomplete="username" maxlength="254" required><label for="password" id="password-label">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required><div id="confirm-wrap" hidden><label for="confirm" id="confirm-label">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" maxlength="1024"></div><button class="primary" id="submit">Sign in</button></form><button class="link" id="forgot">Forgot password?</button><p id="status" role="status" aria-live="polite"></p><p class="foot" id="foot">Access is by invitation. Contact your workspace administrator for an invitation or password reset link.</p></main><script src="/auth/password.js" defer></script></body></html>
